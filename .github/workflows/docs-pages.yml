name: Docs Build and Publish to pages

on:
  push:
    branches:
      - doc
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs deps
        run: pnpm --dir docs install --no-frozen-lockfile

      - name: Build docs
        run: pnpm --dir docs docs:build

      - name: Add CNAME to dist
        run: |
          if [ -f docs/public/CNAME ]; then
            cp docs/public/CNAME docs/.vitepress/dist/CNAME
          fi

      - name: Publish to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: docs/.vitepress/dist
          force_orphan: true
