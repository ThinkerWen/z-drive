<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ file_name }} - 预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 0% -10%, rgba(249, 115, 22, 0.15), transparent 34%),
        radial-gradient(circle at 100% 0%, rgba(14, 165, 233, 0.12), transparent 36%),
        #f8f6f1;
      min-height: 100vh;
      padding: 24px;
      color: #1f2937;
    }
    .page {
      min-height: calc(100vh - 48px);
      width: min(980px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(229, 214, 190, 0.9);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(63, 35, 8, 0.12);
      overflow: hidden;
      margin: auto 0 0;
    }
    .header {
      padding: 22px 26px;
      border-bottom: 1px solid #efe6d8;
      background: linear-gradient(120deg, rgba(255,255,255,0.98), rgba(255,245,230,0.86));
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-all;
    }
    .meta {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      color: #6b7280;
    }
    .chip {
      padding: 5px 9px;
      border-radius: 999px;
      background: #f4f2ed;
      border: 1px solid #e5ddcf;
    }
    .content { padding: 24px 26px 20px; }
    .preview {
      border: 1px solid #e9dfcf;
      border-radius: 14px;
      background: #fff;
      min-height: 280px;
      max-height: 66vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .preview img,
    .preview video {
      max-width: 100%;
      max-height: 66vh;
      object-fit: contain;
      display: block;
    }
    .actions {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      border: 1px solid #d9cbb4;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      text-decoration: none;
      color: #1f2937;
      background: #fff;
      transition: all 0.18s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(0,0,0,0.08); }
    .btn-primary {
      background: #ea580c;
      color: #fff;
      border-color: #ea580c;
    }
    .copy-box {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #eee4d6;
    }
    .copy-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .copy-row {
      display: grid;
      grid-template-columns: 84px 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid #e6ddcf;
      background: #f8f5ee;
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .copy-label { color: #6b7280; font-weight: 600; }
    .copy-value {
      font-family: Consolas, "Cascadia Code", monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .copy-btn {
      border: 0;
      border-radius: 8px;
      background: #ea580c;
      color: #fff;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .copy-btn.copied { background: #16a34a; }
    .powered {
      margin-top: auto;
      padding-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }
    .powered a {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    .powered a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <header class="header">
        <h1 class="title">{{ file_name }}</h1>
        <div class="meta">
          <span class="chip">大小: {{ file_size_formatted }}</span>
          <span class="chip">类型: {{ file_type }}</span>
          <span class="chip">访问: {{ view_count }}</span>
        </div>
      </header>

      <main class="content">
        <section class="preview">
          {% if file_type == "image" %}
            <img src="{{ view_url }}" alt="{{ file_name }}">
          {% elif file_type == "video" %}
            <video src="{{ view_url }}" controls playsinline></video>
          {% else %}
            <p>该文件类型暂不支持预览</p>
          {% endif %}
        </section>

        <div class="actions">
          <a class="btn btn-primary" href="{{ view_url }}" target="_blank" rel="noreferrer">直接访问</a>
          <a class="btn" href="{{ download_url }}">下载文件</a>
        </div>

        <section class="copy-box">
          <p class="copy-title">快捷复制</p>
          {% if file_type == "video" %}
            <div class="copy-row">
              <span class="copy-label">VIDEO</span>
              <span class="copy-value" id="videoText"></span>
              <button class="copy-btn" onclick="copyText('video', this)">复制</button>
            </div>
          {% else %}
            <div class="copy-row">
              <span class="copy-label">Markdown</span>
              <span class="copy-value" id="markdownText"></span>
              <button class="copy-btn" onclick="copyText('markdown', this)">复制</button>
            </div>
            <div class="copy-row">
              <span class="copy-label">IMG</span>
              <span class="copy-value" id="imgText"></span>
              <button class="copy-btn" onclick="copyText('img', this)">复制</button>
            </div>
          {% endif %}
        </section>
      </main>
    </div>
    <p class="powered">
      powered by
      <a href="https://github.com/ThinkerWen/z-drive" target="_blank" rel="noreferrer noopener">z-drive</a>
    </p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const fileName = {{ file_name | tojson }};
      const viewURL = {{ view_url | tojson }};
      const fileType = {{ file_type | tojson }};

      if (fileType === "video") {
        const videoFormat = `<video src="${viewURL}" controls width="500"></video>`;
        document.getElementById("videoText").textContent = videoFormat;
        window.copyTexts = { video: videoFormat };
      } else {
        const markdownFormat = `![${fileName}](${viewURL})`;
        const imgFormat = `<img src="${viewURL}" alt="${fileName}">`;
        document.getElementById("markdownText").textContent = markdownFormat;
        document.getElementById("imgText").textContent = imgFormat;
        window.copyTexts = { markdown: markdownFormat, img: imgFormat };
      }
    });

    function markCopySuccess(button) {
      const oldText = button.textContent;
      button.textContent = "已复制";
      button.classList.add("copied");
      setTimeout(() => {
        button.textContent = oldText;
        button.classList.remove("copied");
      }, 1200);
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch {
        ok = false;
      }
      document.body.removeChild(textarea);
      return ok;
    }

    function copyText(type, button) {
      const text = window.copyTexts?.[type];
      if (!text) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => markCopySuccess(button)).catch(() => {
          if (fallbackCopy(text)) markCopySuccess(button);
        });
      } else if (fallbackCopy(text)) {
        markCopySuccess(button);
      }
    }
  </script>
</body>
</html>
